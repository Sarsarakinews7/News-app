name: Deploy Newsift Dana AI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check required settings
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$CF_ACCOUNT" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$CF_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$GEMINI_KEY" || (echo "Missing GEMINI_API_KEY secret" && exit 1)
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Set Gemini secret and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --name newsift-dana
          wrangler deploy worker.js --name newsift-dana --compatibility-date 2026-11-09 --var ALLOWED_ORIGIN:https://sarsarakinews7.github.io
      - name: Publish Worker URL to GitHub Pages config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SUBDOMAIN=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          test -n "$SUBDOMAIN" || (echo "Could not read the Cloudflare workers.dev subdomain. Enable workers.dev for this account and grant Workers Scripts Read permission." && exit 1)
          URL="https://newsift-dana.$SUBDOMAIN.workers.dev"
          printf 'window.NEWSIFT_AI_URL=%s;\n' "$(printf '%s' "$URL" | jq -Rs .)" > docs/ai-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-config.js
          git diff --cached --quiet || git commit -m "Configure deployed Newsift Dana AI endpoint"
          git push origin "HEAD:$BRANCH"
